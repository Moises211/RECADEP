services:
  # ----------------------------------------------------
  # 1. Backend API (Spring Boot) - Web Service
  # ----------------------------------------------------
  - type: webService
    name: spring-backend
    # Directorio que contiene el Dockerfile y el código fuente del Backend
    rootDir: backend
    # Indica a Render que use el Dockerfile que se encuentra en 'rootDir'
    env: docker
    plan: standard # Puedes cambiar a 'starter' o un plan superior
    
    # Puerto de la aplicación (8080)
    port: 8080
    
    # Variables de Entorno (SECRETS)
    # Debes configurar estos valores como Secrets en el Dashboard de Render.
    envVars:
      # Variables de la base de datos
      - key: PROD_DATASOURCE_URL
        value: ${{ env.PROD_DATASOURCE_URL }}
      - key: PROD_DATASOURCE_USERNAME
        value: ${{ env.PROD_DATASOURCE_USERNAME }}
      - key: PROD_DATASOURCE_PASSWORD
        value: ${{ env.PROD_DATASOURCE_PASSWORD }}
        
      # Configuraciones de Spring/JPA
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_SQL_INIT_MODE
        value: never
      - key: SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION
        value: "true"
        
      # Variables de Auth0
      - key: auth0.domain
        value: ${{ env.AUTH0_DOMAIN }}
      - key: auth0.m2m.clientId
        value: ${{ env.AUTH0_CLIENT }}
      - key: auth0.m2m.clientSecret
        value: ${{ env.AUTH0_CLIENT_SECRET }}
      - key: auth0.roleId
        value: ${{ env.AUTH0_ROLEID }}
        
  # ----------------------------------------------------
  # 2. Frontend (Angular) - Web Service (basado en Docker)
  # ----------------------------------------------------
  - type: webService
    name: angular-frontend
    # Directorio que contiene el Dockerfile y el código fuente del Frontend
    rootDir: frontend
    # Indica a Render que use el Dockerfile que se encuentra en 'rootDir'
    env: docker
    plan: standard
    
    # Puerto que expone el contenedor de Angular (4200)
    port: 4200 
    
    # Variables de Entorno
    envVars:
      # IMPORTANTE: En Render, para que el Frontend (Angular) pueda llamar al Backend,
      # debe usar la URL PÚBLICA (HTTPS) del servicio 'spring-backend', no la URL interna de Docker.
      # Debes reemplazar este valor con la URL pública real después del primer despliegue.
      - key: API_BASE_URL
        value: "https://NOMBRE_DE_TU_BACKEND.onrender.com"